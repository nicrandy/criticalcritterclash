name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, matching the npm that generates
          # package-lock.json locally — npm 10 (Node 20) rejects the lockfile
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Git identity
        run: |
          git config --global user.name "ccc-deploy-bot"
          git config --global user.email "deploy@criticalcritterclash.com"

      - name: Deploy to GitHub Pages
        # gh-pages pushes from its own clone, so it needs the token in the
        # remote URL; the committer identity comes from the global git config
        run: >
          npx gh-pages -d dist
          -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
